<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Czech Phrases">
    <meta name="theme-color" content="#ddd6c6">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="preload" href="fonts/hanken-400.ttf" as="font" type="font/ttf" crossorigin>
    <title>Martin &amp; Alex's Czech Phrasebook</title>
    <style>
        @font-face { font-family: "Hanken Grotesk"; font-weight: 400; font-display: swap; src: url(fonts/hanken-400.ttf) format("truetype"); }
        @font-face { font-family: "Hanken Grotesk"; font-weight: 500; font-display: swap; src: url(fonts/hanken-500.ttf) format("truetype"); }

        /* Sand and moss: a sand-coloured table, paper slips, one moss green for buttons. */
        :root {
            --bg: #ddd6c6; --surface: #d2cab8; --paper: #efe9db;
            --ink: #2a2a26; --muted: #59574e;
            --accent: #4f6238; --accent-ink: #fff;
            --field: #3f5a2a; --field-ink: #fff;
            --radius: 10px; --gutter: 16px;
            --step-small: .875rem; --step-body: 1.0625rem; --step-lead: 1.375rem;
            --step-head: clamp(2.25rem, 1.4rem + 4vw, 3.5rem);
            --step-hero: clamp(3rem, 2rem + 6vw, 5rem);
            --zig: polygon(0 0, 100% 0, 100% 100%, 95.455% calc(100% - 9px), 90.909% 100%, 86.364% calc(100% - 9px), 81.818% 100%, 77.273% calc(100% - 9px), 72.727% 100%, 68.182% calc(100% - 9px), 63.636% 100%, 59.091% calc(100% - 9px), 54.545% 100%, 50% calc(100% - 9px), 45.455% 100%, 40.909% calc(100% - 9px), 36.364% 100%, 31.818% calc(100% - 9px), 27.273% 100%, 22.727% calc(100% - 9px), 18.182% 100%, 13.636% calc(100% - 9px), 9.091% 100%, 4.545% calc(100% - 9px), 0 100%);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1e19; --surface: #2b2e26; --paper: #34372e;
                --ink: #ece7da; --muted: #b6b0a0;
                --accent: #93ad66; --accent-ink: #141a0c;
                --field: #2c3a1e; --field-ink: #ece7da;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--step-body)/1.45 "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -.005em; }
        button { font: inherit; letter-spacing: inherit; color: inherit; }
        svg { display: block; flex: none; }
        :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

        main { max-width: 560px; margin: 0 auto; padding: calc(var(--gutter) + env(safe-area-inset-top)) var(--gutter) calc(112px + env(safe-area-inset-bottom)); }

        /* Type: one display size per view, a lead, a body, a caption. */
        h1 { font-weight: 500; font-size: var(--step-hero); line-height: .98; letter-spacing: -.045em; margin: 0; }
        h2 { font-weight: 500; font-size: var(--step-lead); line-height: 1.1; letter-spacing: -.02em; margin: 0; }
        p { margin: 0; }
        .lead { font-size: var(--step-lead); line-height: 1.25; letter-spacing: -.015em; }
        .small { font-size: var(--step-small); color: var(--muted); }
        .num { font-variant-numeric: tabular-nums; }

        /* Slips: paper on the table, shaped edges, no outlines. */
        .slip { background: var(--paper); clip-path: var(--zig); padding: 28px 22px 44px; margin-bottom: 16px; }
        .slip.flat { clip-path: none; padding-bottom: 22px; }
        .hero { padding-top: 32px; }
        .hero p.lead { margin-top: 20px; max-width: 24ch; }
        .tally { margin-top: 28px; display: flex; align-items: flex-end; gap: 16px; }
        .tally svg { color: var(--ink); }
        .tally span { padding-bottom: 2px; }
        .viewhead { padding: 8px 6px 24px; }
        .viewhead h1 { font-size: var(--step-head); }
        .viewhead .small { margin-top: 10px; font-size: var(--step-body); }

        .slip h2 { margin-bottom: 4px; }
        .rows { list-style: none; margin: 0; padding: 0; }
        .row { display: flex; align-items: center; gap: 10px; padding: 18px 0; border-top: 4px dotted var(--surface); animation: rise .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
        .row:first-child { border-top: 0; }
        .row .txt { flex: 1; min-width: 0; }
        .cz { font-weight: 500; font-size: var(--step-lead); line-height: 1.2; letter-spacing: -.02em; }
        .snd { color: var(--accent); font-size: var(--step-small); font-weight: 500; margin-top: 2px; }
        @media (prefers-color-scheme: dark) { .snd { color: var(--accent); } }
        .slip .snd { color: var(--ink); }
        .en { color: var(--muted); font-size: var(--step-small); margin-top: 2px; }

        /* Buttons: one shape. */
        .ib { flex: none; width: 48px; height: 48px; border-radius: var(--radius); border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: transform .12s; }
        .ib.say { background: var(--accent); color: var(--accent-ink); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--radius); background: var(--surface); color: var(--ink); min-height: 52px; padding: 0 20px; font-weight: 500; cursor: pointer; transition: transform .12s; }
        .btn.primary { background: var(--accent); color: var(--accent-ink); }
        .ib:active, .btn:active, .opt:active { transform: scale(.95); }
        .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
        .btns .btn { flex: 1 1 auto; }

        /* Back of the object: a field of green. */
        .field { background: var(--field); color: var(--field-ink); padding: 32px 22px 36px; margin: 8px 0 0; border-radius: var(--radius); }
        .field p { font-size: var(--step-lead); line-height: 1.25; letter-spacing: -.015em; max-width: 26ch; }
        .field .first { font-weight: 500; }
        .field .small { color: var(--field-ink); opacity: .8; margin-top: 14px; }

        /* Flashcards */
        .card { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; width: 100%; min-height: 340px; text-align: left; border: 0; cursor: pointer; background: var(--paper); clip-path: var(--zig); padding: 28px 22px 48px; margin-bottom: 8px; animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
        .flash { display: flex; flex-direction: column; justify-content: center; gap: 10px; width: 100%; min-height: 340px; text-align: left; border: 0; border-radius: 0; background: var(--paper); color: var(--ink); clip-path: var(--zig); padding: 28px 22px 48px; margin-bottom: 8px; font: inherit; }
        .card .big { font-weight: 500; font-size: var(--step-head); line-height: 1.08; letter-spacing: -.035em; }
        .card .snd { font-size: var(--step-lead); margin-top: 6px; }
        .card .hint { margin-top: 18px; }

        /* Quiz */
        .q { font-weight: 500; font-size: var(--step-head); line-height: 1.02; letter-spacing: -.04em; margin: 0 0 22px; padding: 0 6px; }
        .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 60px; text-align: left; border: 0; border-radius: var(--radius); background: var(--paper); color: var(--ink); font-weight: 500; font-size: var(--step-lead); letter-spacing: -.02em; padding: 12px 18px; margin: 0 0 8px; cursor: pointer; transition: transform .12s; }
        .opt.right { background: var(--accent); color: var(--accent-ink); }
        .opt.wrong { background: var(--ink); color: var(--bg); }
        .opt:disabled { cursor: default; }
        .opt:disabled:not(.right):not(.wrong) { opacity: .55; }
        .progress { padding: 0 6px 12px; }
        .result .tally { margin-top: 0; }
        .result .lead { margin: 16px 0 24px; }

        /* Tab bar */
        nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); padding: 8px var(--gutter) calc(8px + env(safe-area-inset-bottom)); }
        nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); border-radius: calc(var(--radius) + 4px); padding: 6px; }
        nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; border-radius: var(--radius); padding: 9px 0 7px; font-size: var(--step-small); font-weight: 500; color: var(--muted); cursor: pointer; transition: transform .12s; }
        nav.tabs button:active { transform: scale(.95); }
        nav.tabs button[aria-current="true"] { background: var(--ink); color: var(--bg); }

        /* Full-screen phrase: the slip you hold up to the waiter. Always light, for legibility. */
        .overlay { position: fixed; inset: 0; z-index: 50; background: #f4efe3; color: #2a2a26; display: none; flex-direction: column; height: 100dvh; }
        .overlay.on { display: flex; }
        .overlay .top { height: 12px; background: #4f6238; flex: none; }
        .overlay .bar { display: flex; gap: 8px; justify-content: flex-end; padding: max(12px, env(safe-area-inset-top)) 16px 8px; flex: none; }
        .overlay .bar .btn { background: #e3dccb; color: #2a2a26; min-height: 48px; padding: 0 16px; }
        .overlay .body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; padding: 16px 24px 40px; transition: transform .3s; }
        .overlay .body.flip { transform: rotate(180deg); }
        .ov-cz { font-weight: 500; font-size: clamp(2.75rem, 14vw, 5.5rem); line-height: 1.04; letter-spacing: -.04em; overflow-wrap: break-word; }
        .ov-sub { margin-top: 24px; font-size: clamp(1.25rem, 5vw, 1.75rem); color: #3f5a2a; font-weight: 500; letter-spacing: -.015em; }
        .ov-en { margin-top: 8px; font-size: clamp(1.0625rem, 4vw, 1.375rem); color: #59574e; }
        #toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--radius); font-size: var(--step-small); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 60; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
        #toast.on { opacity: 1; }

        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .row, .card { animation: none; }
            * { transition: none !important; }
        }
        @media (min-width: 700px) { main { padding-top: 48px; } .slip { padding: 36px 32px 52px; } .field { padding: 40px 32px; } }
    </style>
</head>
<body class="notranslate" translate="no">
    <main id="main"></main>

    <nav class="tabs" aria-label="Sections">
        <div class="in">
            <button type="button" data-tab="phrases"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/></svg>Phrases</button>
            <button type="button" data-tab="cards"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h13v11H3zM8 5h13v11"/></svg>Cards</button>
            <button type="button" data-tab="quiz"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Quiz</button>
        </div>
    </nav>

    <!-- Full-screen phrase, for showing someone -->
    <div id="ov-phrase" class="overlay" role="dialog" aria-modal="true" aria-label="Phrase, full screen">
        <div class="top"></div>
        <div class="bar">
            <button type="button" class="btn" id="ov-say"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>Say it</button>
            <button type="button" class="btn" data-flip><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5"/></svg>Turn round</button>
            <button type="button" class="btn" data-close>Close</button>
        </div>
        <div class="body" data-body>
            <div class="ov-cz" id="ov-cz" lang="cs"></div>
            <div class="ov-sub" id="ov-sound"></div>
            <div class="ov-en" id="ov-en"></div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="data.js?v=3"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
